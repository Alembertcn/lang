<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <script type="module" crossorigin src="/android_asset/h5hybrid/assets/index-f4795767.js"></script>
  <link rel="stylesheet" href="/android_asset/h5hybrid/assets/index-8b858b34.css">
  <link rel="stylesheet" href="/android_asset/h5hybrid/assets/index-176f20be.css">
</head>

<body>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const designWidth = 375;
    const screenWidth = document.documentElement.clientWidth || window.screen.width;
    document.documentElement.style.fontSize = (screenWidth / designWidth) * 100 + 'px';
  });
</script>
<div id="article-notebook" class="article-notebook">
  <div class="header-section">
    <img src="/android_asset/h5hybrid/assets/read-logo-102eb379.png" alt="">
    <span id="appName"></span>
  </div>
  <div class="content-section">
    <div id="articleContent" class="article-content">
      <div class="article-content-header">
        <div id="updatedAt" class="datetime"></div>
        <div id="tags" class="article-tags"></div>
      </div>
      <div class="article-content-body">
        <div id="title" class="body-title"></div>
        <img id="coverImageUrl" class="body-image" src="" alt="">
        <div id="content" class="body-content"></div>
      </div>
    </div>
    <div class="word-content">
      <div class="user-info">
        <img id="userAvatar" class="avatar" src="" alt="">
        <div id="userName" class="name"><span></span></div>
        <div id="clockInTitle" class="clock-in-title"></div>
        <div id="clockInCount" class="clock-in-body">
          <div class="text">天</div>
        </div>
      </div>
      <div class="word-list">
        <div class="word-list-title">
          <span id="wordListTitle"></span>
          <span id="wordCount"></span>
        </div>
        <div id="wordList" class="word-list-body"></div>
      </div>
    </div>
  </div>
  <div class="word-section">
    <div id="wordGrid" class="word-grid"></div>
  </div>
</div>


</body>
</html>
